name: quran_sunnah_app
description: Premium Quran and authentic Sunnah app (iOS + Android). Verified datasets only — no invented religious text.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.11
  dynamic_color: ^2.1.0
  path_provider: ^2.1.4
  share_plus: ^13.3.1
  collection: ^1.18.0
  xml: ^7.1.0
  drift: ^2.35.1
  drift_flutter: ^0.3.1
  crypto: ^3.0.7
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.15.1
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/integrity_manifest.json
    - assets/content_packages.json
    - assets/licenses/DATA_NOTICES.txt
    - assets/quran/PROVENANCE-indopak.txt
    - assets/quran/PROVENANCE-riwayat.txt
    - assets/quran/tafsir/PROVENANCE.txt
    - assets/quran/tajweed/PROVENANCE.txt
    - assets/quran/translations/PROVENANCE.txt
    - assets/quran/words/PROVENANCE.txt
    - assets/hadith/abudawud/PROVENANCE.txt
    - assets/hadith/bukhari/PROVENANCE.txt
    - assets/hadith/dehlawi/PROVENANCE.txt
    - assets/hadith/ibnmajah/PROVENANCE.txt
    - assets/hadith/malik/PROVENANCE.txt
    - assets/hadith/muslim/PROVENANCE.txt
    - assets/hadith/nasai/PROVENANCE.txt
    - assets/hadith/nawawi/PROVENANCE.txt
    - assets/hadith/qudsi/PROVENANCE.txt
    - assets/hadith/tirmidhi/PROVENANCE.txt
    - assets/quran/hafs-an-asim/uthmani.txt
    - assets/quran/hafs-an-asim/imlai.txt
    - assets/quran/hafs-an-asim/indopak.txt
    - assets/quran/warsh-an-nafi/uthmani.txt
    - assets/quran/qalun-an-nafi/uthmani.txt
    - assets/quran/metadata/quran-data.xml
    - assets/hadith/bukhari/index.json
    - assets/hadith/bukhari/sections/
    - assets/hadith/muslim/index.json
    - assets/hadith/muslim/sections/

  fonts:
    - family: Amiri Quran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    - family: Noto Naskh Arabic
      fonts:
        - asset: assets/fonts/NotoNaskhArabic-Variable.ttf
