name: KMP CI

# KMP CI (post-cutover, only workflow): shared tests + Android unit tests +
# debug APK; signed test APK job (temp-key recipe); iOS framework compile on
# a macOS runner.
#
# The two Android jobs share the SDK installer composite action in
# .github/actions/setup-android-sdk (see that file for why the pinned
# android-actions/setup-android is not used).
on:
  pull_request:
  push:
    branches:
      - main
      - kmp-migration
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No android-actions/setup-android: ubuntu-latest images ship the SDK
      # (ANDROID_HOME + cmdline-tools preinstalled); the pinned action targets
      # Node 20 and fails fast under the Node 24-only runners. cmdline-tools
      # are NOT on PATH by default, so export them here (exit 127 otherwise).
      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Shared SDK installer (same block in the test-apk job): see
      # .github/actions/setup-android-sdk for why the pinned action isn't used.
      - uses: ./.github/actions/setup-android-sdk

      - name: Shared tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Android unit tests
        run: ./gradlew :androidApp:testDebugUnitTest --no-daemon

      - name: Android lint
        run: ./gradlew :androidApp:lintDebug --no-daemon

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kmp/scripts/requirements-visual-regression.txt

      - name: Install screenshot comparator
        run: python -m pip install -r scripts/requirements-visual-regression.txt

      - name: Test regression tooling
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Assemble app and test APKs
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleDebugAndroidTest --no-daemon

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Offline UI flows and visual captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader -feature -Vulkan -memory 2048 -cores 2
          disable-animations: true
          script: cd kmp && python scripts/run_android_regressions.py --suite all

      - name: Compare reviewed screenshot baselines
        run: >-
          python scripts/verify_screenshots.py verify
          --expected androidApp/src/androidTest/screenshots
          --actual androidApp/build/outputs/visual-regression
          --report androidApp/build/reports/visual-regression

      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-evidence
          path: |
            kmp/androidApp/build/reports/visual-regression/
            kmp/androidApp/build/outputs/visual-regression/
            kmp/androidApp/build/outputs/regression-results/
            kmp/androidApp/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

  test-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: android
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      # Shared SDK installer (same block as the android job).
      - uses: ./.github/actions/setup-android-sdk

      # Temp-key recipe: throwaway keystore, never tracked (*.jks is git-ignored).
      - name: Create temporary test signing key
        shell: bash
        run: |
          keytool -genkeypair -keystore androidApp/test-release.jks -storepass android -keypass android -alias test -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Quran Sunnah Test,O=Godfather59,C=MA"

      - name: Build unsigned release APK
        run: ./gradlew :androidApp:assembleRelease -PtestArtifact=true --no-daemon

      - name: Sign test APK
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" sign --ks androidApp/test-release.jks --ks-pass pass:android --key-pass pass:android --out androidApp/build/outputs/apk/release/app-kmp-release-signed.apk androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk

      - name: Verify Android signature
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs androidApp/build/outputs/apk/release/app-kmp-release-signed.apk

      - name: Report APK size and checksum
        shell: bash
        run: |
          ls -lh androidApp/build/outputs/apk/release/app-kmp-release-signed.apk
          sha256sum androidApp/build/outputs/apk/release/app-kmp-release-signed.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quran-sunnah-kmp-test-apk
          path: kmp/androidApp/build/outputs/apk/release/app-kmp-release-signed.apk
          if-no-files-found: error
          retention-days: 14

  ios-compile:
    # Build the shared Kotlin frameworks and the native SwiftUI app on macOS.
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: kmp
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Compile shared iOS targets
        run: ./gradlew :shared:compileKotlinIosX64 :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Build iOS app for Simulator
        run: xcodebuild -project iosApp.xcodeproj -scheme QuranSunnahKMP -configuration Debug -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
