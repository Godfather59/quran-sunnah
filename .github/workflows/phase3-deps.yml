name: Phase 3 dependency sync

on:
  push:
    branches:
      - feat/phase3-product-content
    paths:
      - pubspec.yaml
      - .github/workflows/phase3-deps.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase3-product-content
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Commit dependency and generated-file sync
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib/data/database/app_database.g.dart
          if git diff --cached --quiet; then
            echo "Already synchronized."
            exit 0
          fi
          git commit -m "chore: sync Phase 3 dependencies"
          git push
