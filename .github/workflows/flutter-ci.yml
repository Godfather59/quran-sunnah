name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - fix/stabilize-quran-sunnah

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
