name: Regenerate Flutter Lock

on:
  push:
    branches:
      - fix/latest-update-build

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/latest-update-build
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - name: Commit lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh Flutter 3.44 lockfile"
          git pull --rebase origin fix/latest-update-build
          git push
