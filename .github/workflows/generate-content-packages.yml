name: Generate Content Packages

on:
  push:
    branches:
      - feat/phase4-content-packages
    paths:
      - tool/generate_content_packages.dart
      - .github/workflows/generate-content-packages.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase4-content-packages
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: dart run tool/generate_content_packages.dart
      - name: Commit manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/content_packages.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: generate content package manifest"
          git push
