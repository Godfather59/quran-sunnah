name: Drift Codegen

on:
  push:
    branches:
      - feat/phase2-production-data
    paths:
      - lib/data/database/app_database.dart
      - pubspec.yaml
      - .github/workflows/drift-codegen.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-production-data
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.44.0'
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - name: Commit generated Drift files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/data/database/app_database.g.dart pubspec.lock
          if git diff --cached --quiet; then
            echo "Generated files already up to date."
            exit 0
          fi
          git commit -m "chore: generate Drift database bindings"
          git push
