name: Setup Android SDK
description: >-
  Self-contained Android SDK install. ubuntu-latest ships cmdline-tools but
  does NOT put them on PATH (exit 127 otherwise), and android-actions/
  setup-android is pinned to Node 20 while the runners are Node 24-only.
  Used by both the android and test-apk jobs.

runs:
  using: composite
  steps:
    - name: Install Android SDK
      shell: bash
      run: |
        export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        cd "$RUNNER_TEMP"
        curl -sS -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
        mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
        rm cmdtools.zip
        {
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
        } >> "$GITHUB_ENV"
        export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
        yes | sdkmanager --licenses > /dev/null || true
        sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
        ls "$ANDROID_HOME/platforms"
